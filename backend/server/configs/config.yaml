# HTTP 与认证运行配置。
http:
  addr: ":8080"

auth:
  jwt_secret: "change-me"
  access_token_ttl_seconds: 7200
  ws_token_ttl_seconds: 60

heartbeat:
  interval_seconds: 10
  timeout_seconds: 30

# PostgreSQL 运行配置。
postgres:
  # dsn: "postgres://postgres:postgres_pocket_pet@38.76.179.44:5432/pocket_pet?sslmode=disable"
  dsn: "postgres://postgres:postgres_pocket_pet@117.72.124.51:5432/pocket_pet?sslmode=disable"
  max_open_conns: 20
  max_idle_conns: 10
  conn_max_lifetime_seconds: 1800

# Redis 运行配置。
redis:
  addr: "38.76.179.44:6379"
  password: ""
  db: 0
  key_prefix: "pocket_pet"
