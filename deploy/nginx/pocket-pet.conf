# Admin 对外端口：9001
server {
    listen 9001;
    server_name _;

    root /var/www/pocket-pet-admin;
    index index.html;

    access_log /var/log/nginx/pocket-pet-admin.access.log;
    error_log  /var/log/nginx/pocket-pet-admin.error.log;

    # 后台前端静态资源与前端路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后台管理接口
    location /api/admin/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 后台可选健康检查
    location = /healthz {
        proxy_pass http://127.0.0.1:8080/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
    }

    # 禁止通过 admin 端口访问客户端登录接口
    location /api/v1/ {
        return 403;
    }

    # 禁止通过 admin 端口访问 websocket
    location /ws {
        return 403;
    }
}

# 客户端对外端口：80
# - Godot Web 静态页：/var/www/pocket-pet-web
# - 客户端 HTTP / WebSocket 反代到本机 8080
server {
    listen 80;
    server_name _;

    root /var/www/pocket-pet-web;
    index index.html;

    access_log /var/log/nginx/pocket-pet-client.access.log;
    error_log  /var/log/nginx/pocket-pet-client.error.log;

    # Godot 4 Web 导出需要（export_presets.cfg 已开启 COI）
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # 客户端 HTTP 接口，例如登录
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 客户端 websocket
    location /ws {
        proxy_pass http://127.0.0.1:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    # 客户端可选健康检查
    location = /healthz {
        proxy_pass http://127.0.0.1:8080/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
    }

    # 禁止客户端端口访问后台接口
    location /api/admin/ {
        return 403;
    }

    # Godot Web 静态资源（index.html / index.wasm / index.pck 等）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
