# Admin 对外端口：9001
server {
    listen 9001;
    server_name _;

    root /var/www/pocket-pet-admin;
    index index.html;

    access_log /var/log/nginx/pocket-pet-admin.access.log;
    error_log  /var/log/nginx/pocket-pet-admin.error.log;

    # 后台前端静态资源与前端路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后台管理接口
    location /api/admin/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 后台可选健康检查
    location = /healthz {
        proxy_pass http://127.0.0.1:8080/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
    }

    # 禁止通过 admin 端口访问客户端登录接口
    location /api/v1/ {
        return 403;
    }

    # 禁止通过 admin 端口访问 websocket
    location /ws {
        return 403;
    }
}

# 客户端域名：touwomugua.cn
# - HTTP 80 自动跳转 HTTPS
# - HTTPS 443 提供 Godot Web 静态页，并反代 /api/v1 与 /ws 到本机 8080
# - 正式证书请放到 /etc/nginx/ssl/pocket-pet/fullchain.pem 与 privkey.pem
#   （需覆盖 touwomugua.cn；若证书不含 www，可删掉 server_name 中的 www 项）

# HTTP → HTTPS 跳转
server {
    listen 80;
    server_name touwomugua.cn www.touwomugua.cn;
    return 301 https://$host$request_uri;
}

# HTTPS 客户端入口
server {
    listen 443 ssl;
    server_name touwomugua.cn www.touwomugua.cn;

    ssl_certificate     /etc/nginx/ssl/pocket-pet/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/pocket-pet/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /var/www/pocket-pet-web;
    index index.html;

    access_log /var/log/nginx/pocket-pet-client.access.log;
    error_log  /var/log/nginx/pocket-pet-client.error.log;

    # Godot 4 Web 导出需要（export_presets.cfg 已开启 COI）
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # 客户端 HTTP 接口，例如登录
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 客户端 websocket
    location /ws {
        proxy_pass http://127.0.0.1:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    # 客户端健康检查
    location = /healthz {
        proxy_pass http://127.0.0.1:8080/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 禁止客户端域名访问后台接口
    location /api/admin/ {
        return 403;
    }

    # Godot Web 静态资源（index.html / index.wasm / index.pck 等）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
