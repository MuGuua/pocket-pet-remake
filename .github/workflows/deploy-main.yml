  name: Deploy Main

  on:
    push:
      branches:
        - main

  jobs:
    build-and-deploy:
      runs-on: ubuntu-latest

      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Setup Go
          uses: actions/setup-go@v5
          with:
            go-version-file: backend/go.mod

        - name: Build backend
          working-directory: backend
          env:
            CGO_ENABLED: 0
            GOOS: linux
            GOARCH: amd64
          run: |
            go mod download
            mkdir -p ../build/backend
            go build -o ../build/backend/game-server ./server/cmd/game-server

        - name: Setup Node
          uses: actions/setup-node@v4
          with:
            node-version: 20
            cache: npm
            cache-dependency-path: admin/package-lock.json

        - name: Build admin
          working-directory: admin
          run: |
            npm ci
            npm run build

        - name: Prepare release package
          run: |
            mkdir -p release/backend
            mkdir -p release/admin
            mkdir -p release/nginx
            cp build/backend/game-server release/backend/game-server
            cp -R admin/dist release/admin/dist
            cp deploy/nginx/pocket-pet.conf release/nginx/pocket-pet.conf
            # Web 客户端静态包体积较大，改由本地手动导出后上传到服务器 /var/www/pocket-pet-web/
            # mkdir -p release/web
            # rsync -a --exclude '*.import' client/builds/web/ release/web/
            # test -f release/web/index.html
            # test -f release/web/index.js
            # test -f release/web/index.wasm
            # test -f release/web/index.pck

        - name: Upload release to server
          uses: appleboy/scp-action@v0.1.7
          with:
            host: ${{ secrets.SERVER_HOST }}
            username: ${{ secrets.SERVER_USER }}
            key: ${{ secrets.SERVER_SSH_KEY }}
            port: ${{ secrets.SERVER_PORT }}
            source: "release/*"
            target: "${{ secrets.SERVER_APP_DIR }}/releases/${{ github.sha }}"
            strip_components: 1

        - name: Activate release
          uses: appleboy/ssh-action@v1.0.3
          with:
            host: ${{ secrets.SERVER_HOST }}
            username: ${{ secrets.SERVER_USER }}
            key: ${{ secrets.SERVER_SSH_KEY }}
            port: ${{ secrets.SERVER_PORT }}
            script: |
              set -e

              APP_DIR="${{ secrets.SERVER_APP_DIR }}"
              RELEASE_DIR="$APP_DIR/releases/${{ github.sha }}"

              ln -sfn "$RELEASE_DIR" "$APP_DIR/current"

              # 未安装 nginx 时自动安装（Debian/Ubuntu 或 RHEL 系）
              if ! command -v nginx >/dev/null 2>&1; then
                if command -v apt-get >/dev/null 2>&1; then
                  apt-get update
                  DEBIAN_FRONTEND=noninteractive apt-get install -y nginx
                elif command -v yum >/dev/null 2>&1; then
                  yum install -y nginx
                elif command -v dnf >/dev/null 2>&1; then
                  dnf install -y nginx
                else
                  echo "nginx is not installed and no supported package manager was found" >&2
                  exit 1
                fi
              fi

              mkdir -p /var/www/pocket-pet-admin
              mkdir -p /var/www/pocket-pet-web
              mkdir -p /etc/nginx/conf.d

              rm -rf /var/www/pocket-pet-admin/*
              cp -R "$RELEASE_DIR/admin/dist/"* /var/www/pocket-pet-admin/

              # Web 客户端静态包改由本地手动上传，流水线不覆盖 /var/www/pocket-pet-web/
              # rm -rf /var/www/pocket-pet-web/*
              # cp -R "$RELEASE_DIR/web/"* /var/www/pocket-pet-web/

              # 移除系统自带默认站点，避免与客户端 80 端口 server_name 冲突导致 /healthz 404
              rm -f /etc/nginx/sites-enabled/default
              rm -f /etc/nginx/conf.d/default.conf

              cp "$RELEASE_DIR/nginx/pocket-pet.conf" /etc/nginx/conf.d/pocket-pet.conf
              nginx -t

              systemctl enable nginx
              systemctl restart pocket-pet-backend
              systemctl restart nginx

              systemctl is-active --quiet pocket-pet-backend
              systemctl is-active --quiet nginx
              curl -fsS http://127.0.0.1:8080/healthz >/dev/null
              curl -fsS http://127.0.0.1:9001/healthz >/dev/null
              curl -fsS http://127.0.0.1/healthz >/dev/null
              # Web 静态页由手动上传，不在流水线里校验 index.html
              # curl -fsS http://127.0.0.1/index.html >/dev/null