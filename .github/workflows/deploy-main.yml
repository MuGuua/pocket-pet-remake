  name: Deploy Main

  on:
    push:
      branches:
        - main

  jobs:
    build-and-deploy:
      runs-on: ubuntu-latest

      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Setup Go
          uses: actions/setup-go@v5
          with:
            go-version-file: backend/go.mod

        - name: Build backend
          working-directory: backend
          env:
            CGO_ENABLED: 0
            GOOS: linux
            GOARCH: amd64
          run: |
            go mod download
            mkdir -p ../build/backend
            go build -o ../build/backend/game-server ./server/cmd/game-server

        - name: Setup Node
          uses: actions/setup-node@v4
          with:
            node-version: 20
            cache: npm
            cache-dependency-path: admin/package-lock.json

        - name: Build admin
          working-directory: admin
          run: |
            npm ci
            npm run build

        - name: Prepare release package
          run: |
            mkdir -p release/backend
            mkdir -p release/admin
            cp build/backend/game-server release/backend/game-server
            cp -R admin/dist release/admin/dist

        - name: Upload release to server
          uses: appleboy/scp-action@v0.1.7
          with:
            host: ${{ secrets.SERVER_HOST }}
            username: ${{ secrets.SERVER_USER }}
            key: ${{ secrets.SERVER_SSH_KEY }}
            port: ${{ secrets.SERVER_PORT }}
            source: "release/*"
            target: "${{ secrets.SERVER_APP_DIR }}/releases/${{ github.sha }}"
            strip_components: 1

        - name: Activate release
          uses: appleboy/ssh-action@v1.0.3
          with:
            host: ${{ secrets.SERVER_HOST }}
            username: ${{ secrets.SERVER_USER }}
            key: ${{ secrets.SERVER_SSH_KEY }}
            port: ${{ secrets.SERVER_PORT }}
            script: |
              set -e

              APP_DIR="${{ secrets.SERVER_APP_DIR }}"
              RELEASE_DIR="$APP_DIR/releases/${{ github.sha }}"

              ln -sfn "$RELEASE_DIR" "$APP_DIR/current"

              rm -rf /var/www/pocket-pet-admin/*
              cp -R "$RELEASE_DIR/admin/dist/"* /var/www/pocket-pet-admin/

              systemctl restart pocket-pet-backend
              systemctl reload nginx

              systemctl is-active --quiet pocket-pet-backend
              curl -fsS http://127.0.0.1:8080/healthz >/dev/null